apiVersion: v1
kind: Secret
metadata:
  name: vibamart-secrets
  namespace: vibamart-production
  labels:
    app.kubernetes.io/name: vibamart
    app.kubernetes.io/component: web
type: Opaque
stringData:
  FIREBASE_PROJECT_ID: "viba-mart-prod"
  FIREBASE_CLIENT_EMAIL: "firebase-adminsdk@viba-mart-prod.iam.gserviceaccount.com"
  # Base64 or string secrets referenced securely at runtime
  FIREBASE_PRIVATE_KEY: "PLACEHOLDER_INJECTED_BY_CICD_PLATFORM"
  RAZORPAY_KEY_ID: "PLACEHOLDER_INJECTED_BY_CICD_PLATFORM"
  RAZORPAY_KEY_SECRET: "PLACEHOLDER_INJECTED_BY_CICD_PLATFORM"
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_PORT: "587"
  SMTP_USER: "apikey"
  SMTP_PASS: "PLACEHOLDER_INJECTED_BY_CICD_PLATFORM"
