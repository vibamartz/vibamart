apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vibamart-network-policy
  namespace: vibamart-production
  labels:
    app.kubernetes.io/name: vibamart
spec:
  podSelector:
    matchLabels:
      app: vibamart-web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from NGINX Ingress controller or cluster pods on port 3000
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow DNS, HTTPS external APIs (Firebase, Razorpay, SMTP), and internal DB traffic
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
