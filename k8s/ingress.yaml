apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vibamart-ingress
  namespace: vibamart-production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls:
    - hosts:
        - vibamart.vercel.com
        - vibamart.in
        - www.vibamart.in
      secretName: vibamart-tls-cert
  rules:
    - host: vibamart.vercel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vibamart-service
                port:
                  number: 80
    - host: vibamart.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vibamart-service
                port:
                  number: 80
    - host: www.vibamart.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vibamart-service
                port:
                  number: 80
