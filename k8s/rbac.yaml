apiVersion: v1
kind: ServiceAccount
metadata:
  name: vibamart-deployer
  namespace: vibamart-production
  labels:
    app.kubernetes.io/name: vibamart
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vibamart-deployer-role
  namespace: vibamart-production
rules:
  - apiGroups: ["apps", ""]
    resources: ["deployments", "pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vibamart-deployer-binding
  namespace: vibamart-production
subjects:
  - kind: ServiceAccount
    name: vibamart-deployer
    namespace: vibamart-production
roleRef:
  kind: Role
  name: vibamart-deployer-role
  apiGroup: rbac.authorization.k8s.io
