apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibamart-web
  namespace: vibamart-production
  labels:
    app.kubernetes.io/name: vibamart
    app.kubernetes.io/component: web
    app.kubernetes.io/managed-by: viba-cicd
spec:
  replicas: 3
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: vibamart-web
  template:
    metadata:
      labels:
        app: vibamart-web
        app.kubernetes.io/name: vibamart
    spec:
      serviceAccountName: vibamart-deployer
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: vibamart-web
          # Immutable container image tag updated dynamically by ViBa CI/CD pipeline
          image: registry.example.com/vibamart:a1b2c3d4e5f6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: vibamart-config
            - secretRef:
                name: vibamart-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      terminationGracePeriodSeconds: 30
